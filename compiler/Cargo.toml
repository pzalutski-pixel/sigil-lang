[package]
name = "sigil-compiler"
version = "0.1.0"
edition = "2021"
description = "Native compiler for the Sigil programming language using LLVM"

[dependencies]
# Error handling
thiserror = "1.0"
anyhow = "1.0"

# LLVM bindings - inkwell provides safe wrapper
inkwell = { version = "0.5", features = ["llvm18-0"] }

# Contract hash computation (Section 14.3)
sha2 = "0.10"
hex = "0.4"

# Incremental compilation cache (M10-T5)
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[build-dependencies]

[dev-dependencies]
tempfile = "3.10"
